name: Keep Render Alive
on:
  schedule:
    - cron: '*/12 * * * *' # Pings every 12 minutes 24/7 to prevent Render free-tier 15min sleep
  workflow_dispatch: # Allows manual triggering from GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MeteoSran Render Server
        run: |
          echo "Pinging MeteoSran custom domain and Render server at $(date -u)..."
          curl -s -f -m 30 -I https://meteosran.com/ping || curl -s -f -m 30 -I https://meteosran.onrender.com/ping || echo "Ping request sent."